name: CD - Deploy Continuo

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissoes necessarias para deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente por vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy-pages:
    name: Build e Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias e compilar
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build --if-present
          else
            mkdir -p dist
            echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Plataforma Educacional</title></head><body><h1>Plataforma Educacional de Programação</h1><p>Ambiente em inicialização.</p></body></html>" > dist/index.html
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Realizar Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  deploy-vercel:
    name: Deploy para Vercel (Opcional)
    runs-on: ubuntu-latest
    if: ${{ env.HAS_VERCEL_TOKEN != '' }}
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar informacoes do ambiente Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Compilar artefatos de producao Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar deploy em producao na Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
