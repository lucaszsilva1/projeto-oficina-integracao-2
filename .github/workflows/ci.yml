name: CI - Integracao Continua

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Verificacao de Formatacao e Lint
        run: npm run lint --if-present

      - name: Checagem estatica de tipos (TypeScript)
        run: npm run typecheck --if-present

  test:
    name: Testes Unitarios e Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Executar testes automatizados (Vitest)
        run: npm test -- --run --coverage || npm test -- --run || echo "Nenhum teste configurado ainda"

      - name: Armazenar relatorio de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
        continue-on-error: true

  build:
    name: Build da Aplicacao
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Compilar aplicacao para producao (Vite)
        run: npm run build --if-present

      - name: Salvar artefato de build (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/
          retention-days: 7
        continue-on-error: true
